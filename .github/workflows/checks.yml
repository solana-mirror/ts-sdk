name: TS SDK - Checks

on: 
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run ci